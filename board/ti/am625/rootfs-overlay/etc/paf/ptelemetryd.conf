[daemon]
enabled = false
socket = /run/ptelemetryd.sock
ipc_socket = /run/ptelemetryd-ipc.sock
mcu = main_mcu
mcu_request_period_ms = 1000
log_enabled = false
log_file = /var/log/ptelemetryd.log

[bmc]
# Previous BMC configuration example:
# endpoint = https://192.168.18.247
# username = ADMIN
# password_file = /etc/bmctool/xfusion.password
endpoint = https://192.168.10.201
username = Administrator
password_file = /etc/bmctool/xfusion.password
protocol = redfish
period_ms = 10000
timeout_ms = 5000
insecure_tls = false
