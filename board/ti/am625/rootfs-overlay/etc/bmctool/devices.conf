# BMC device inventory used by bmctool_test. Passwords remain in separate,
# root-owned files and are never stored in this file.

[global]
default_device = xfusion

[device xfusion]
expected_manufacturer = XFUSION

[provider redfish-0]
protocol = redfish
endpoint = https://192.168.10.201
username = Administrator
password_file = /etc/bmctool/xfusion.password
timeout_ms = 5000
insecure_tls = true

[provider ipmi-0]
protocol = ipmi
endpoint = 192.168.10.201
username = Administrator
password_file = /etc/bmctool/xfusion.password
timeout_ms = 5000
ipmi_2_0_only = true

[device supermicro]
expected_manufacturer = Supermicro

[provider redfish-0]
protocol = redfish
endpoint = https://192.168.10.252
username = ADMIN
password_file = /etc/bmctool/supermicro.password
timeout_ms = 5000
insecure_tls = true

[provider ipmi-0]
protocol = ipmi
endpoint = 192.168.10.252
username = ADMIN
password_file = /etc/bmctool/supermicro.password
timeout_ms = 5000
ipmi_2_0_only = true
