[link]
# SocketCAN interface is board configuration, not a PDM logical device.
interface = can0
request_timeout_ms = 2000

[telemetry]
enabled = false
socket = /run/ptelemetryd.sock
ipc_socket = /run/ptelemetryd-ipc.sock
mcu = main_mcu
mcu_request_period_ms = 1000
log_enabled = false
log_file = /var/log/ptelemetryd.log

[can]
interfaces=can0 can1
bitrate=500000
data-bitrate=2000000
restart-ms=100
ip=/sbin/ip
