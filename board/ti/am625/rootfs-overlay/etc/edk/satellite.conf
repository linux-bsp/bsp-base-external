[link]
# SocketCAN interface is board configuration, not a PDM logical device.
interface = can0
protocol = t5000
request_timeout_ms = 2000

[telemetry]
enabled = true
socket = /run/ptelemetryd.sock
ipc_socket = /run/ptelemetryd-ipc.sock
mcu = main_mcu
mcu_enabled = false
mcu_request_period_ms = 1000
# Enable MCU sampling when the board is deployed with a responding MCU.
os_enabled = true
log_enabled = false
log_file = /var/log/ptelemetryd.log

[can]
interfaces=can0 can1
# List the interfaces that use Classic CAN, for example: can0 can1
classic-interfaces=
bitrate=500000
data-bitrate=2000000
restart-ms=100
ip=/sbin/ip
