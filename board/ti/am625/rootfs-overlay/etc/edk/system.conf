[firmware]
# AM62x SD/MMC RAW A/B layout shared with U-Boot.
device=/dev/mmcblk1
storage-type=block
hwid-config=/etc/fw_env.config
boot-attempts=3
work-dir=/tmp
update-protocol=tftp
update-server=192.168.18.245
update-path=.
update-release=release.itb

# Remote bootloader updates remain disabled because ROM always reads tiboot3_a.
allow-bootloader-update=false
require-signature=false
signature-key=

meta0-offset=0x00500000
meta0-size=0x00010000
meta1-offset=0x00510000
meta1-size=0x00010000
tiboot3_a-offset=0x00000000
tiboot3_a-size=0x00100000
tiboot3_b-offset=0x00700000
tiboot3_b-size=0x00100000
tispl_a-offset=0x00100000
tispl_a-size=0x00200000
tispl_b-offset=0x00800000
tispl_b-size=0x00200000
uboot_a-offset=0x00300000
uboot_a-size=0x00200000
uboot_b-offset=0x00a00000
uboot_b-size=0x00200000
kernel_a-offset=0x01000000
kernel_a-size=0x01800000
kernel_b-offset=0x02800000
kernel_b-size=0x01800000
rootfs_a-offset=0x04000000
rootfs_a-size=0x08000000
rootfs_b-offset=0x0c000000
rootfs_b-size=0x08000000

[ota]
enabled=1
server=http://192.168.10.246:8090
cache=/data/fwctld
cache-keep=1
state-dir=/data/fwctld-state
interval=15
auto-install=1
device-id=
console=/dev/console
interface=eth0

[health]
# Local health only: no carrier, switch or remote server dependency.
required-unit=systemd-networkd.service
required-netdev=lo
required-netdev=eth0
auto-mark-good=1

[storage]
# AM625 data filesystem. This filesystem is never formatted during boot.
device=/dev/mmcblk1p15
filesystem=ext4
mountpoint=/data
options=nodev,nosuid
minimum_free_kib=32768

[recovery]
# Embedded in kernel FIT; independent of the rootfs being recovered.
server=http://192.168.10.246:8090
interface=eth0
root-a=/dev/mmcblk1p13
root-b=/dev/mmcblk1p14

[logging]
# AM625 development setup: no credential provisioning required.
server=http://192.168.10.246:8090
auth=none
device=
interface=eth0

[time]
# Independent time service; '-' selects the Device Manager HTTP time source.
server=http://192.168.10.246:8090
auth=none
device=
interface=eth0
source=-
enabled=1
interval=3600
