# Board development debugger. The CGI needs local PDM/procfs access.
server.modules = ("mod_alias", "mod_cgi", "mod_setenv")
server.document-root = "/usr/share/pdebug-web"
server.port = 8080
server.bind = "0.0.0.0"
server.pid-file = "/run/pdebug-web/lighttpd.pid"
server.errorlog = "/var/log/pdebug-web.log"
server.breakagelog = "/var/log/pdebug-web.log"
server.max-connections = 16
server.max-request-size = 8
server.max-read-idle = 15
server.max-write-idle = 130
server.upload-dirs = ("/run/pdebug-web")
index-file.names = ("index.html")
dir-listing.activate = "disable"
mimetype.assign = (".html" => "text/html; charset=utf-8", ".css" => "text/css; charset=utf-8", ".js" => "text/javascript; charset=utf-8")
alias.url = ("/cgi-bin/" => "/usr/libexec/pdebug-web/")
cgi.assign = (".cgi" => "")
cgi.execute-x-only = "enable"
cgi.limits = ("read-timeout" => 125, "write-timeout" => 15)
setenv.set-response-header = (
    "X-Content-Type-Options" => "nosniff",
    "X-Frame-Options" => "DENY",
    "Referrer-Policy" => "no-referrer",
    "Content-Security-Policy" => "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'",
    "Cache-Control" => "no-store"
)
